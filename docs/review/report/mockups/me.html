<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>货记 · 设置 · 设计示意</title>
<style>/* v1.3 formal-plan static mockup; does not connect to business data. */
:root{--bg:#f5f7f5;--paper:#fff;--line:#e3e9e5;--text:#1f2a24;--muted:#5f6c64;--brand:#263b32;--warn:#8a5a14;--warn-bg:#fdf3e3;--info:#2f5d8a;--info-bg:#e9f0f7;--ok:#1f7a4d;--ok-bg:#e8f3ec}
*{box-sizing:border-box}html{background:#e9ece8}body{margin:0 auto;width:100%;max-width:414px;color:var(--text);font:14px/1.5 "Noto Sans CJK SC","PingFang SC",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit;letter-spacing:0}button{background:none;border:0;cursor:pointer}a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--info);outline-offset:2px}
h1,h2,h3,p{margin:0}h2{font-size:16px;font-weight:600}h3{font-size:15px;font-weight:600}p{color:var(--muted);font-size:12px}b{font-weight:600}img{display:block;max-width:100%;object-fit:cover}.icon{width:22px;height:22px;flex-shrink:0;display:block}
.screen{height:812px;min-height:600px;background:var(--bg);display:flex;flex-direction:column;position:relative}
.demo{height:24px;flex:0 0 24px;font-size:12px;text-align:center;line-height:24px;color:var(--muted);background:#edf1ed}
.statusbar{height:32px;flex:0 0 32px;padding:3px 22px;display:flex;justify-content:space-between;align-items:center}
.navbar{height:44px;flex:0 0 44px;display:flex;align-items:center;position:relative}.navbar h1{font-size:17px;font-weight:600;min-width:0;max-width:calc(100% - 140px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.capsule{position:absolute;right:8px;top:6px;width:86px;height:32px;border:1px solid #d8ddd8;background:white;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:16px}
.capsule-dots{width:45px;text-align:center;line-height:1}.capsule-sep{height:18px;width:1px;background:#d8ddd8}.capsule-ring{width:14px;height:14px;border:1.5px solid var(--text);border-radius:50%;margin:0 12px;flex-shrink:0;position:relative}.capsule-ring:after{content:"";position:absolute;inset:3px;border:1px solid var(--text);border-radius:50%}
.content{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding-bottom:16px}
.settings-entry{display:flex;justify-content:flex-end;padding:0 16px}.settings-entry .btn{min-width:44px;min-height:44px;border:0;padding:8px;color:var(--brand)}
.intro{padding:12px 16px 16px}.intro p{margin-top:5px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}.gap{justify-content:flex-start;flex-wrap:wrap;margin-top:10px}
.section{padding:14px 16px;background:var(--paper);border-bottom:1px solid var(--line)}.section+.section{margin-top:12px}
.section-title{padding:8px 16px;display:flex;justify-content:space-between;align-items:center}.section-title h2{font-size:14px}
.section-title button,.row>button{min-height:44px;padding:0 4px;color:var(--brand);font-size:12px}
.help{font-size:12px;line-height:1.6;margin:10px 0 0}.content>.help{margin:14px 16px}
.tag{font-size:12px;line-height:20px;padding:0 5px;border-radius:4px;background:#eef1ef;color:#4a574f;white-space:nowrap}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.info{background:var(--info-bg);color:var(--info)}.tag.ok{background:var(--ok-bg);color:var(--ok)}
.notice{margin:0 16px 12px;padding:10px;font-size:12px;display:flex;gap:8px;align-items:center;border-radius:6px}.notice.warn{background:var(--warn-bg);color:var(--warn)}.notice a{flex-shrink:0;min-height:44px;display:flex;align-items:center;font-weight:600}.notice span{flex:1;min-width:0}
.visits{padding:0 16px;background:var(--paper)}.visit{display:flex;align-items:center;gap:10px;min-height:98px;border-bottom:1px solid var(--line)}.visit:last-child{border-bottom:0}.visit>img{width:56px;height:56px;border-radius:6px;flex-shrink:0}.visit>a:not(.camera-btn){flex:1;min-width:0;padding:8px 0}.visit h3{line-height:22px}.visit p{font-size:12px}.visit span{font-size:12px;color:var(--muted)}
.camera-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--brand);flex-shrink:0}
.actions{padding:10px 12px;border-top:1px solid var(--line);background:white;display:flex;align-items:stretch;gap:8px;flex-shrink:0}
.btn{min-width:0;min-height:44px;padding:9px 12px;border:1px solid #c9d3cc;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;line-height:22px;text-align:center;overflow-wrap:anywhere}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.actions>.btn{flex:1;padding-left:6px;padding-right:6px}
.tabbar{height:54px;flex:0 0 54px;background:white;display:flex;border-top:1px solid var(--line);padding:4px 0}.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#66706a;font-size:12px}.tab.on{color:var(--brand);font-weight:600}
.homebar{height:20px;flex:0 0 20px;background:#fff;position:relative}.homebar:before{content:"";position:absolute;left:calc(50% - 54px);width:108px;height:4px;bottom:6px;background:#1f2a24;border-radius:3px}
.search{height:44px;display:flex;align-items:center;gap:8px;border:1px solid #d4ddd6;border-radius:6px;background:white;padding:0 10px}
.search{height:46px}.search input{height:44px;min-height:44px!important}
input,textarea{min-width:0;width:100%;border:1px solid #d5ded7;border-radius:6px;background:#f8faf8;padding:9px 10px;outline:none;font-size:15px}input{min-height:44px}input::placeholder,textarea::placeholder{color:#79867d;font-size:13px}.search input{border:0;padding:0;background:white;min-height:40px}
.field{display:flex;align-items:center;gap:12px;margin-top:12px}.field>span{flex:0 0 76px;font-size:12px;color:#4a574f}.field.block{display:block}.field.block>span{display:block;margin-bottom:6px}.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.merchant-match{display:flex;align-items:center;gap:10px;margin:0 16px 12px;padding:12px;background:white;border:1px solid var(--line);border-radius:8px}.merchant-match img{width:56px;height:56px}.merchant-match>div{flex:1;min-width:0}
.context{margin:0 16px 10px;display:flex;align-items:center;gap:10px;font-size:14px}.context span{color:var(--muted);font-size:12px}
.photos{display:flex;gap:10px}.photos>img{width:74px;height:74px;border-radius:6px;flex-shrink:0}.add-photo{width:74px;height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px dashed #adbbb0;border-radius:6px;gap:4px;font-size:12px}
.photo-tools{display:flex;gap:12px;margin-top:4px}.photo-tools .btn{border:0;background:none;padding:4px 0;font-size:12px;color:var(--muted)}
details{margin-top:12px;border-top:1px solid var(--line)}summary{cursor:pointer;min-height:44px;line-height:44px;font-size:14px}summary span{font-size:12px;color:var(--muted);margin-left:6px}.formula{font-size:13px;margin-top:8px;color:var(--brand)}
.filters{padding:8px 16px 12px;background:white;border-bottom:1px solid var(--line)}.filter{min-height:44px;padding:6px 7px;font-size:12px;color:#4a574f;min-width:44px;white-space:nowrap}.filter.active{color:var(--brand);font-weight:600;border-bottom:2px solid var(--brand)}.filters>.search{margin:4px 0}
.product{display:flex;align-items:center;gap:10px;padding:12px 0;margin:0 16px;border-bottom:1px solid var(--line);min-height:105px}.product-photo{width:64px;height:76px;flex-shrink:0}.product-photo img{width:64px;height:76px;border-radius:6px}.product-info{flex:1;min-width:0}.product-info h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:23px}.product-info p{font-size:12px;line-height:18px;color:#4a574f}.product-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px}.price{font-size:16px;color:var(--text);white-space:nowrap}
.favorite{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#53665a}
.review-photo{padding:0 16px 14px}.review-photo img{width:100%;height:180px;object-fit:contain;background:#fff;border-radius:6px}.ai-proposal{padding:12px 0;margin-top:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.ai-proposal p{margin-top:4px}.ai-proposal .btn{min-height:44px}
.compare-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;padding:0 16px 18px}.compare-grid img{width:100%;height:130px;object-fit:contain;background:white;border-radius:6px;margin-bottom:8px}.compare-grid h3{font-size:14px}.compare-table{margin:0 16px;background:white}.compare-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:8px;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}.compare-row b{text-align:right}.compare-row span{font-size:12px}.different{background:var(--info-bg)}.labels{color:var(--muted)}
.seg{display:flex;gap:4px;margin-top:10px}.seg button{min-height:44px;flex:1;background:#f1f5f2;font-size:13px;border:1px solid var(--line);border-radius:6px}.seg button.active{background:var(--brand);color:white}
.setting{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;font-size:13px;border-bottom:1px solid var(--line)}.setting button{min-height:44px;min-width:0;font-size:12px}
.paper{border:1px solid var(--line);padding:12px 8px;margin-top:8px;background:white}.paper-title{text-align:center;display:flex;flex-direction:column;font-size:12px;margin-bottom:8px}.paper-title span{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12px}th,td{border:1px solid #d9e0db;padding:6px 3px;overflow-wrap:anywhere;text-align:right;vertical-align:middle}th{font-weight:500;background:#f4f7f4}th:first-child,td:first-child{width:30%;text-align:left}th:last-child,td:last-child{width:23%}td img{height:52px;width:100%;object-fit:contain;margin-top:5px}
.paper-total{font-size:12px;color:var(--text);font-weight:600;text-align:right;margin-top:8px}.paper-note{font-size:12px;line-height:1.5;margin-top:7px}
.menu{background:white;padding:0 16px}.menu button{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:52px;border-bottom:1px solid var(--line);font-size:14px}
.toast{position:fixed;z-index:100;bottom:100px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:360px;background:#263b32;color:white;border-radius:8px;padding:12px;font-size:13px;text-align:center}
@media(max-width:340px){.actions .btn{font-size:13px}.product{gap:8px}.product-photo,.product-photo img{width:56px}.row{gap:4px}.filter{padding-left:3px;padding-right:3px}.photos>img,.add-photo{width:68px;height:68px}}
</style></head><body><main class="screen">
<aside class="demo">静态示意 · 不连接业务 · 数据虚构</aside>
<div class="statusbar" aria-hidden="true"><b>9:41</b><span>▮▮▮　▰</span></div>
<header class="navbar"><a class="back" aria-label="返回" href="05-library-list.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg></a><h1>设置</h1><span class="capsule" aria-hidden="true"><span class="capsule-dots">•••</span><span class="capsule-sep"></span><span class="capsule-ring"></span></span></header><div class="content"><section class="intro"><h2>采购员 · 示例账号</h2><p>自己的商品、偏好和格式设置</p></section><section class="menu"><button data-demo>个人资料<span>›</span></button><button data-demo>收藏<span>›</span></button><button data-demo>本机草稿<span>›</span></button><button data-demo>Excel 格式<span>›</span></button><button data-demo>使用帮助<span>›</span></button></section><p class="help">从商户 / 商品右上角进入，返回原页面。设置不是第三个 tab，不增加采购管理入口。</p></div><div class="homebar"></div>
</main><div class="toast" role="status" hidden></div>
<script>document.querySelectorAll('[data-demo]').forEach(el=>el.addEventListener('click',()=>{const t=document.querySelector('.toast');t.textContent='静态示意：不会保存或分享数据，不代表小程序验收';t.hidden=false;setTimeout(()=>t.hidden=true,2500);}));</script>
</body></html>
